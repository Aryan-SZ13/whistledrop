<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 360" width="100%" height="100%" style="background:#0f172a; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <style>
    .title { font-size: 17px; font-weight: 700; fill: #f8fafc; }
    .subtitle { font-size: 11px; fill: #94a3b8; }
    .axis { stroke: #334155; stroke-width: 1; }
    .grid { stroke: #1e293b; stroke-width: 1; stroke-dasharray: 3 3; }
    .label { font-size: 11px; fill: #cbd5e1; }
    .iter { font-size: 9px; fill: #64748b; }
    .val { font-size: 11px; font-weight: 700; fill: #f8fafc; }
    .caveat { font-size: 10px; fill: #94a3b8; font-style: italic; }
  </style>

  <text x="30" y="32" class="title">WhistleDrop — Microbenchmark Throughput Comparison</text>
  <text x="30" y="50" class="subtitle">Sequential operations per second (ops/sec) measured locally on loopback PostgreSQL 16 &amp; Redis 7</text>

  <!-- X-Axis Gridlines (0 to 1500 ops/s) -->
  <line x1="250.0" y1="75" x2="250.0" y2="280" class="grid" />
  <text x="250.0" y="295" class="label" text-anchor="middle">0</text>
  <line x1="346.0" y1="75" x2="346.0" y2="280" class="grid" />
  <text x="346.0" y="295" class="label" text-anchor="middle">300</text>
  <line x1="442.0" y1="75" x2="442.0" y2="280" class="grid" />
  <text x="442.0" y="295" class="label" text-anchor="middle">600</text>
  <line x1="538.0" y1="75" x2="538.0" y2="280" class="grid" />
  <text x="538.0" y="295" class="label" text-anchor="middle">900</text>
  <line x1="634.0" y1="75" x2="634.0" y2="280" class="grid" />
  <text x="634.0" y="295" class="label" text-anchor="middle">1200</text>
  <line x1="730.0" y1="75" x2="730.0" y2="280" class="grid" />
  <text x="730.0" y="295" class="label" text-anchor="middle">1500</text>

  <!-- ALEE AES-256-GCM Decryption -->
  <text x="235" y="106" class="label" text-anchor="end">ALEE AES-256-GCM Decryption</text>
  <rect x="250" y="90" width="443.7" height="24" rx="3" fill="#10b981" />
  <text x="703.7" y="106" class="val">1386.7 ops/s <tspan class="iter">(N=50)</tspan></text>
  <!-- ALEE AES-256-GCM Encryption -->
  <text x="235" y="144" class="label" text-anchor="end">ALEE AES-256-GCM Encryption</text>
  <rect x="250" y="128" width="298.8" height="24" rx="3" fill="#06b6d4" />
  <text x="558.8" y="144" class="val">933.7 ops/s <tspan class="iter">(N=50)</tspan></text>
  <!-- Anonymous Case Tracking -->
  <text x="235" y="182" class="label" text-anchor="end">Anonymous Case Tracking</text>
  <rect x="250" y="166" width="160.5" height="24" rx="3" fill="#38bdf8" />
  <text x="420.5" y="182" class="val">501.5 ops/s <tspan class="iter">(N=25)</tspan></text>
  <!-- Merkle Leaf Commitment -->
  <text x="235" y="220" class="label" text-anchor="end">Merkle Leaf Commitment</text>
  <rect x="250" y="204" width="107.7" height="24" rx="3" fill="#f59e0b" />
  <text x="367.7" y="220" class="val">336.5 ops/s <tspan class="iter">(N=50)</tspan></text>
  <!-- Full Report Ingestion Pipeline -->
  <text x="235" y="258" class="label" text-anchor="end">Full Report Ingestion Pipeline</text>
  <rect x="250" y="242" width="30.3" height="24" rx="3" fill="#a855f7" />
  <text x="290.3" y="258" class="val">94.8 ops/s <tspan class="iter">(N=25)</tspan></text>
  <line x1="250" y1="75" x2="250" y2="280" class="axis" />
  <text x="30" y="340" class="caveat">* Scope: Single-client sequential microbenchmarks. Raw cryptographic &amp; transactional algorithmic speed; not distributed saturation.</text>
</svg>