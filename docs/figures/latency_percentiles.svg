<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 430" width="100%" height="100%" style="background:#0f172a; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <style>
    .title { font-size: 17px; font-weight: 700; fill: #f8fafc; }
    .subtitle { font-size: 11px; fill: #94a3b8; }
    .axis { stroke: #334155; stroke-width: 1; }
    .grid { stroke: #1e293b; stroke-width: 1; stroke-dasharray: 3 3; }
    .label { font-size: 11px; fill: #cbd5e1; }
    .iter { font-size: 9px; fill: #64748b; }
    .val { font-size: 10px; font-weight: 600; fill: #f8fafc; text-anchor: middle; }
    .legend { font-size: 11px; fill: #cbd5e1; }
    .caveat { font-size: 10px; fill: #f59e0b; font-style: italic; }
  </style>

  <!-- Title & Context -->
  <text x="30" y="32" class="title">WhistleDrop — Microbenchmark Latency Percentiles (Plotted Summary Statistics)</text>
  <text x="30" y="50" class="subtitle">Sequential local microbenchmarks on Apple Silicon / macOS / Python 3.13 / PostgreSQL 16 (NullPool) / Redis 7</text>

  <!-- Legend -->
  <rect x="520" y="24" width="12" height="12" rx="2" fill="#38bdf8" />
  <text x="538" y="34" class="legend">p50 (Median)</text>
  <rect x="615" y="24" width="12" height="12" rx="2" fill="#f59e0b" />
  <text x="633" y="34" class="legend">p95</text>
  <rect x="675" y="24" width="12" height="12" rx="2" fill="#ef4444" />
  <text x="693" y="34" class="legend">p99</text>

  <!-- Y-Axis Gridlines (0ms to 40ms) -->
  <line x1="160" y1="92.0" x2="770" y2="92.0" class="grid" />
  <text x="145" y="96.0" class="label" text-anchor="end">40 ms</text>
  <line x1="160" y1="154.0" x2="770" y2="154.0" class="grid" />
  <text x="145" y="158.0" class="label" text-anchor="end">30 ms</text>
  <line x1="160" y1="216.0" x2="770" y2="216.0" class="grid" />
  <text x="145" y="220.0" class="label" text-anchor="end">20 ms</text>
  <line x1="160" y1="278.0" x2="770" y2="278.0" class="grid" />
  <text x="145" y="282.0" class="label" text-anchor="end">10 ms</text>
  <line x1="160" y1="340" x2="770" y2="340" class="axis" />
  <text x="145" y="344" class="label" text-anchor="end">0 ms</text>

  <!-- Full Ingestion (N=25) -->
  <text x="240" y="360" class="label" text-anchor="middle">Full Ingestion</text>
  <text x="240" y="372" class="iter" text-anchor="middle">N=25</text>
  <rect x="210.5" y="287.4" width="17" height="52.6" rx="2" fill="#38bdf8" />
  <text x="219.0" y="283.4" class="val">8.5</text>
  <rect x="231.5" y="210.7" width="17" height="129.3" rx="2" fill="#f59e0b" />
  <text x="240.0" y="206.7" class="val">20.9</text>
  <rect x="252.5" y="165.2" width="17" height="174.8" rx="2" fill="#ef4444" />
  <text x="261.0" y="161.2" class="val">28.2</text>
  <!-- Merkle Leaf (N=50) -->
  <text x="360" y="360" class="label" text-anchor="middle">Merkle Leaf</text>
  <text x="360" y="372" class="iter" text-anchor="middle">N=50</text>
  <rect x="330.5" y="328.8" width="17" height="11.2" rx="2" fill="#38bdf8" />
  <text x="339.0" y="324.8" class="val">1.8</text>
  <rect x="351.5" y="310.2" width="17" height="29.8" rx="2" fill="#f59e0b" />
  <text x="360.0" y="306.2" class="val">4.8</text>
  <rect x="372.5" y="113.8" width="17" height="226.2" rx="2" fill="#ef4444" />
  <text x="381.0" y="109.8" class="val">36.5</text>
  <!-- Case Tracking (N=25) -->
  <text x="480" y="360" class="label" text-anchor="middle">Case Tracking</text>
  <text x="480" y="372" class="iter" text-anchor="middle">N=25</text>
  <rect x="450.5" y="333.1" width="17" height="6.9" rx="2" fill="#38bdf8" />
  <text x="459.0" y="329.1" class="val">1.1</text>
  <rect x="471.5" y="302.9" width="17" height="37.1" rx="2" fill="#f59e0b" />
  <text x="480.0" y="298.9" class="val">6.0</text>
  <rect x="492.5" y="293.9" width="17" height="46.1" rx="2" fill="#ef4444" />
  <text x="501.0" y="289.9" class="val">7.4</text>
  <!-- ALEE Encrypt (N=50) -->
  <text x="600" y="360" class="label" text-anchor="middle">ALEE Encrypt</text>
  <text x="600" y="372" class="iter" text-anchor="middle">N=50</text>
  <rect x="570.5" y="334.0" width="17" height="6.0" rx="2" fill="#38bdf8" />
  <text x="579.0" y="330.0" class="val">1.0</text>
  <rect x="591.5" y="330.9" width="17" height="9.1" rx="2" fill="#f59e0b" />
  <text x="600.0" y="326.9" class="val">1.5</text>
  <rect x="612.5" y="303.6" width="17" height="36.4" rx="2" fill="#ef4444" />
  <text x="621.0" y="299.6" class="val">5.9</text>
  <!-- ALEE Decrypt (N=50) -->
  <text x="710" y="360" class="label" text-anchor="middle">ALEE Decrypt</text>
  <text x="710" y="372" class="iter" text-anchor="middle">N=50</text>
  <rect x="680.5" y="336.2" width="17" height="3.8" rx="2" fill="#38bdf8" />
  <text x="689.0" y="332.2" class="val">0.6</text>
  <rect x="701.5" y="331.8" width="17" height="8.2" rx="2" fill="#f59e0b" />
  <text x="710.0" y="327.8" class="val">1.3</text>
  <rect x="722.5" y="315.1" width="17" height="24.9" rx="2" fill="#ef4444" />
  <text x="731.0" y="311.1" class="val">4.0</text>

  <!-- Statistical Caveat Footer -->
  <text x="30" y="410" class="caveat">* Caveat: Small sample sizes (N=25-50 sequential iterations). p99 tail values are preliminary summary statistics and not production latency guarantees.</text>
</svg>