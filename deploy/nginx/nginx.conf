user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # ==========================================================================
    # PRIVACY-PRESERVING LOGGING — STRIP ALL CLIENT IDENTIFIERS
    # Under no circumstances are reporter IP addresses or user agents recorded.
    # ==========================================================================
    log_format anonymous '[$time_iso8601] "$request_method $uri" '
                         '$status $body_bytes_sent '
                         'rt=$request_time uct="$upstream_connect_time" uht="$upstream_header_time" urt="$upstream_response_time"';

    access_log /var/log/nginx/access.log anonymous;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    server_tokens off;

    # Rate limiting zones
    limit_req_zone $binary_remote_addr zone=api_general:10m rate=30r/s;
    limit_req_zone $binary_remote_addr zone=reports_submit:10m rate=10r/m;
    limit_req_zone $binary_remote_addr zone=evidence_upload:10m rate=15r/m;

    # Upstream application cluster
    upstream whistledrop_backend {
        server api:8000;
        keepalive 32;
    }

    # Port 80 HTTP server block: Redirect all plain HTTP traffic to HTTPS (Option A TLS termination)
    server {
        listen 80;
        listen [::]:80;
        server_name _;

        # Internal health check exception for container healthcheck
        location = /api/v1/health {
            proxy_pass http://whistledrop_backend;
            proxy_set_header Host $host;
            proxy_http_version 1.1;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # Port 443 HTTPS server block: Production TLS Termination
    server {
        listen 443 ssl;
        listen [::]:443 ssl;
        http2 on;
        server_name _;

        # TLS Certificates
        ssl_certificate /etc/nginx/certs/whistledrop.crt;
        ssl_certificate_key /etc/nginx/certs/whistledrop.key;

        # TLS Protocols & Ciphers (Hardened Modern Configuration)
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
        ssl_prefer_server_ciphers off;
        ssl_session_timeout 1d;
        ssl_session_cache shared:SSL:10m;
        ssl_session_tickets off;

        # Client body limit for evidence uploads (25MB max)
        client_max_body_size 25M;

        # Hardened HTTP Security Headers
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self';" always;

        # Deny access to Prometheus metrics from public internet
        location = /metrics {
            deny all;
            return 403;
        }

        # Anonymous report submission rate limit
        location = /api/v1/reports {
            limit_req zone=reports_submit burst=5 nodelay;
            proxy_pass http://whistledrop_backend;
            proxy_set_header Host $host;
            # Anonymization invariant: Strip identifying upstream headers
            proxy_set_header X-Forwarded-For "";
            proxy_set_header X-Real-IP "";
            proxy_set_header Forwarded "";
            proxy_set_header X-Forwarded-Proto https;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
        }

        # Evidence file upload rate limit
        location ~ ^/api/v1/evidence/upload {
            limit_req zone=evidence_upload burst=10 nodelay;
            proxy_pass http://whistledrop_backend;
            proxy_set_header Host $host;
            # Anonymization invariant: Strip identifying upstream headers
            proxy_set_header X-Forwarded-For "";
            proxy_set_header X-Real-IP "";
            proxy_set_header Forwarded "";
            proxy_set_header X-Forwarded-Proto https;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
        }

        # General API proxy
        location /api/ {
            limit_req zone=api_general burst=20 nodelay;
            proxy_pass http://whistledrop_backend;
            proxy_set_header Host $host;
            # Anonymization invariant: Strip identifying upstream headers
            proxy_set_header X-Forwarded-For "";
            proxy_set_header X-Real-IP "";
            proxy_set_header Forwarded "";
            proxy_set_header X-Forwarded-Proto https;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
        }

        # Single-Page Application (Frontend Static Distribution)
        location / {
            root /var/www/html;
            index index.html index.htm;
            try_files $uri $uri/ /index.html;
            expires 1h;
            add_header Cache-Control "public, no-transform";
        }
    }
}
