services:
  db:
    image: postgres:16-alpine
    container_name: whistledrop_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-whistledrop}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-whistledrop_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-whistledrop_db}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-whistledrop} -d ${POSTGRES_DB:-whistledrop_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
